<script>
(function(){
 const params=new URLSearchParams(location.search); const selected=params.get('screen'); const printAll=params.get('print')==='1'; const capture=params.get('capture')==='1';
 const screens=[...document.querySelectorAll('.screen')]; const sel=document.getElementById('screenSelect');
 function show(slug){screens.forEach(s=>s.style.display=(printAll||s.id===slug)?'block':'none'); if(sel)sel.value=slug; if(!printAll)history.replaceState(null,'','?screen='+slug);}
 if(printAll){screens.forEach(s=>s.style.display='block');document.body.classList.add('print-all')} else show(selected||screens[0].id);
 if(sel)sel.addEventListener('change',e=>show(e.target.value));
 document.getElementById('prev').onclick=()=>{let i=screens.findIndex(s=>s.style.display!=='none');show(screens[Math.max(0,i-1)].id)};
 document.getElementById('next').onclick=()=>{let i=screens.findIndex(s=>s.style.display!=='none');show(screens[Math.min(screens.length-1,i+1)].id)};
 if(capture||printAll)document.querySelector('.viewer-controls').style.display='none';
})();
</script></body></html>
